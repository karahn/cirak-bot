name: Sync to other bots

on:
  push:
    paths:
      - 'cirak/actions/cirak_kosu.py'
      - 'cirak/actions/bot_cekirdek.py'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cirak-bot
        uses: actions/checkout@v4

      - name: Clone C-rak-bot
        run: |
          git clone https://github.com/karahn/C-rak-bot.git
          cd C-rak-bot
          git checkout arena/71f59bcb-c-rak-bot

      - name: Clone arastirmaci42-bot
        run: |
          git clone https://github.com/karahn/arastirmaci42-bot.git

      - name: Sync to C-rak-bot
        run: |
          cp cirak/actions/cirak_kosu.py C-rak-bot/cirak/actions/
          cp cirak/actions/bot_cekirdek.py C-rak-bot/cirak/actions/
          cd C-rak-bot
          git config user.name "sync-bot"
          git config user.email "bot@sync.local"
          git add cirak/actions/
          git commit -m "🔄 Sync from cirak-bot" || exit 0
          git push origin arena/71f59bcb-c-rak-bot

      - name: Sync to arastirmaci42-bot
        run: |
          cp cirak/actions/cirak_kosu.py arastirmaci42-bot/cirak/actions/
          cp cirak/actions/bot_cekirdek.py arastirmaci42-bot/cirak/actions/
          cd arastirmaci42-bot
          git config user.name "sync-bot"
          git config user.email "bot@sync.local"
          git add cirak/actions/
          git commit -m "🔄 Sync from cirak-bot" || exit 0
          git push origin main
